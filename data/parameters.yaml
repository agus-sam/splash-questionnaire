# SPLASH Questionnaire and Simulation: versioned parameter file
#
# Every number the calculation uses lives here, with unit, source and status.
# Entries with `pessimistic` / `central` / `optimistic` are the uncertain ones.
# "Pessimistic" and "optimistic" always refer to the effect on the operator's
# NPV (pessimistic = worse for the investment case), not to the size of the number.
#
# status:
#   sourced      value taken from a named source (see `source`)
#   project      value fixed by the SPLASH project team
#   illustrative value so that the app runs; must be replaced or signed off before publication of results
#
# While meta.status is "draft_unvalidated" the app shows a visible banner.

meta:
  version: "0.2.0-draft"
  status: draft_unvalidated
  date: "2026-11-23"
  description_en: "Draft parameter set. Illustrative entries must be replaced by values from the SPLASH technology and economics data before the survey goes out."
  description_de: "Entwurf des Parametersatzes. Illustrative Einträge müssen vor Start der Befragung durch Werte aus den SPLASH-Technologie- und Wirtschaftsdaten ersetzt werden."

parameters:
  # ------------------------------------------------------------------ finance
  lifetime_years:
    label_en: "Evaluation period"
    label_de: "Betrachtungszeitraum"
    unit: "a"
    value: 20
    status: illustrative
    source: "Illustrative value. Typical heat pump life is 15 to 20 years, to be confirmed."
  wacc:
    label_en: "Nominal discount rate (WACC)"
    label_de: "Nominaler Kalkulationszins (WACC)"
    unit: "1/a"
    pessimistic: 0.09
    central: 0.07
    optimistic: 0.05
    status: illustrative
    source: "Typical German range for municipal and commercial heating investments (5 to 9 % nominal). To be confirmed by the SPLASH team."
  inflation:
    label_en: "General inflation"
    label_de: "Allgemeine Inflation"
    unit: "1/a"
    pessimistic: 0.015
    central: 0.02
    optimistic: 0.025
    status: sourced
    source: "ECB medium-term target 2 %. Destatis: 2.2 % in 2025, about 2.8 % in October 2026 (energy driven)."
  price_escalation_fuel:
    label_en: "Annual real price change, heat fuels (above inflation)"
    label_de: "Jährliche reale Preisänderung Wärmeträger (über Inflation)"
    unit: "1/a"
    pessimistic: 0.0
    central: 0.02
    optimistic: 0.04
    status: illustrative
    source: "Illustrative value. Could follow the UBA projections framework data 2025."
  price_escalation_electricity:
    label_en: "Annual real price change, electricity (above inflation)"
    label_de: "Jährliche reale Preisänderung Strom (über Inflation)"
    unit: "1/a"
    pessimistic: 0.03
    central: 0.01
    optimistic: 0.0
    status: illustrative
    source: "Illustrative value. Could follow the UBA projections framework data 2025."

  # ------------------------------------------------------------------- prices
  price_gas:
    label_en: "Natural gas price (net, incl. CO2 cost)"
    label_de: "Erdgaspreis (netto, inkl. CO2-Kosten)"
    unit: "EUR/kWh"
    pessimistic: 0.065
    central: 0.085
    optimistic: 0.105
    status: illustrative
    source: "Illustrative value. Replaced by the operator's own price when given."
  price_oil:
    label_en: "Heating oil price (net)"
    label_de: "Heizölpreis (netto)"
    unit: "EUR/kWh"
    pessimistic: 0.09
    central: 0.11
    optimistic: 0.13
    status: illustrative
    source: "Illustrative value, no source yet."
  price_district_heat:
    label_en: "District heat price (net)"
    label_de: "Fernwärmepreis (netto)"
    unit: "EUR/kWh"
    pessimistic: 0.09
    central: 0.11
    optimistic: 0.13
    status: illustrative
    source: "Illustrative value. District heat tariffs are operator specific."
  price_other_heat:
    label_en: "Other heat source price (net)"
    label_de: "Preis sonstige Wärmequelle (netto)"
    unit: "EUR/kWh"
    value: 0.10
    status: illustrative
    source: "Illustrative value, no source yet."
  price_electricity:
    label_en: "Electricity price for the heat pump or heater (net)"
    label_de: "Strompreis für Wärmepumpe oder Heizstab (netto)"
    unit: "EUR/kWh"
    pessimistic: 0.27
    central: 0.22
    optimistic: 0.18
    status: illustrative
    source: "Illustrative value. Replaced by the operator's own price when given."
  vat_rate:
    label_en: "VAT rate"
    label_de: "Umsatzsteuersatz"
    unit: "1"
    value: 0.19
    status: sourced
    source: "German VAT standard rate."
  vat_deductible_by_legal_form:
    label_en: "Operator can deduct input VAT"
    label_de: "Betreiber kann Vorsteuer abziehen"
    unit: "-"
    value:
      municipal_operation: false
      municipal_company: true
      association: false
      private: true
      other: false
    status: illustrative
    source: "Illustrative value. Depends on the individual tax status; to be checked."

  # --------------------------------------------------- unit conversion, boilers
  gas_kwh_per_m3:
    label_en: "Gas: kWh per m3 (billing value)"
    label_de: "Gas: kWh je m3 (Abrechnungswert)"
    unit: "kWh/m3"
    value: 10.5
    status: illustrative
    source: "Illustrative value. The invoice states the exact value (Brennwert x Zustandszahl)."
  oil_kwh_per_l:
    label_en: "Heating oil: kWh per litre"
    label_de: "Heizöl: kWh je Liter"
    unit: "kWh/l"
    value: 10.0
    status: illustrative
    source: "Illustrative value. Common reference value for light heating oil."
  eta_boiler_gas:
    label_en: "Boiler efficiency, gas"
    label_de: "Kesselwirkungsgrad Gas"
    unit: "1"
    value: 0.90
    status: illustrative
    source: "Illustrative value, no source yet."
  eta_boiler_oil:
    label_en: "Boiler efficiency, oil"
    label_de: "Kesselwirkungsgrad Öl"
    unit: "1"
    value: 0.88
    status: illustrative
    source: "Illustrative value, no source yet."
  eta_district_heat:
    label_en: "Transfer efficiency, district heat"
    label_de: "Übergabewirkungsgrad Fernwärme"
    unit: "1"
    value: 0.97
    status: illustrative
    source: "Illustrative value, no source yet."
  eta_other_heat:
    label_en: "Efficiency, other heat source"
    label_de: "Wirkungsgrad sonstige Wärmequelle"
    unit: "1"
    value: 0.85
    status: illustrative
    source: "Illustrative value, no source yet."
  old_boiler_age_years:
    label_en: "Boiler age above which an efficiency penalty applies"
    label_de: "Kesselalter, ab dem ein Wirkungsgradabschlag gilt"
    unit: "a"
    value: 20
    status: illustrative
    source: "Illustrative value, no source yet."
  old_boiler_eta_delta:
    label_en: "Efficiency change for old boilers"
    label_de: "Wirkungsgradänderung alte Kessel"
    unit: "1"
    value: -0.04
    status: illustrative
    source: "Illustrative value, no source yet."

  # ------------------------------------------------------------- benchmarks
  bench_heat_kwh_per_m2:
    label_en: "Heat use per m2 water surface and year, municipal indoor and combined pools (n = 67)"
    label_de: "Wärmeverbrauch je m2 Wasserfläche und Jahr, kommunale Hallen- und Kombibäder (n = 67)"
    unit: "kWh/(m2 a)"
    value:
      median: 2013.60
      mean: 2243.68
      min: 513.04
      max: 5057.61
    status: sourced
    source: "UBA Texte 139/2024, Table 2 (heated basins). https://umweltbundesamt.de/sites/default/files/medien/11850/publikationen/139_2024_energieverbrauch_schwimmbaeder.pdf"
  bench_elec_kwh_per_m2:
    label_en: "Electricity use per m2 water surface and year, municipal indoor and combined pools (n = 67)"
    label_de: "Stromverbrauch je m2 Wasserfläche und Jahr, kommunale Hallen- und Kombibäder (n = 67)"
    unit: "kWh/(m2 a)"
    value:
      median: 631.23
      min: 185.46
      max: 1927.34
    status: sourced
    source: "UBA Texte 139/2024, Table 2 (heated basins)."

  # --------------------------------------------- defaults for missing answers
  default_hall_area_factor:
    label_en: "Hall floor area per m2 of water surface (used when not given)"
    label_de: "Hallenfläche je m2 Wasserfläche (wenn nicht angegeben)"
