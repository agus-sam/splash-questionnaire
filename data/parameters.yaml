    label_de: "Nettopreis für Überschussstrom (Voreinstellung, änderbar)"
    unit: "EUR/MWh"
    value: 23
    status: project
    source: "Default set by the project lead for the first view. No tariff of this kind is guaranteed. The break-even price is shown next to it."
