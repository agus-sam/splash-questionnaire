    label_de: "Investition Wärmepumpe je kW thermisch"
    unit: "EUR/kW"
    pessimistic: 1100
    central: 850
    optimistic: 700
    status: illustrative
    source: "Illustrative value. Replace with SPLASH technology data."
  hp_capex_fixed:
    label_en: "Heat pump fixed cost (hydraulics, planning, commissioning)"
    label_de: "Fixkosten Wärmepumpe (Hydraulik, Planung, Inbetriebnahme)"
    unit: "EUR"
    pessimistic: 25000
    central: 15000
    optimistic: 10000
    status: illustrative
    source: "Illustrative value, no source yet."
  hp_om_rate:
    label_en: "Heat pump O&M, share of investment per year"
    label_de: "Wartung Wärmepumpe, Anteil der Investition je Jahr"
    unit: "1/a"
    pessimistic: 0.03
    central: 0.02
    optimistic: 0.015
    status: illustrative
    source: "Illustrative value, no source yet."
  heater_capex_per_kw_el:
    label_en: "Electric heater investment per kW"
    label_de: "Investition Heizstab je kW"
    unit: "EUR/kW"
    pessimistic: 200
    central: 120
    optimistic: 80
    status: illustrative
    source: "Illustrative value, no source yet."
  flex_capex_fixed:
    label_en: "Flexibility fixed cost (controls, metering, aggregator interface)"
    label_de: "Fixkosten Flexibilität (Regelung, Messtechnik, Aggregator-Schnittstelle)"
    unit: "EUR"
    pessimistic: 30000
    central: 20000
    optimistic: 12000
    status: illustrative
    source: "Illustrative value, no source yet."
  flex_om_rate:
    label_en: "Flexibility O&M, share of investment per year"
    label_de: "Wartung Flexibilität, Anteil der Investition je Jahr"
    unit: "1/a"
    value: 0.02
    status: illustrative
    source: "Illustrative value, no source yet."

  # ---------------------------------------------------------------- subsidy
  subsidy_rate:
    label_en: "BEG heating grant rate (heat pumps)"
    label_de: "Zuschusssatz BEG Heizungsförderung (Wärmepumpen)"
    unit: "1"
    value: 0.30
    status: sourced
    source: "KfW 522 page, up to 30 % of eligible costs. Programme rules changed on 21 July 2026. https://www.kfw.de/inlandsfoerderung/Unternehmen/Energie-und-Umwelt/F%c3%b6rderprodukte/Heizungsf%c3%b6rderung-f%c3%bcr-Unternehmen-%e2%80%93-Nichtwohngeb%c3%a4ude-(522)/"
  subsidy_cap_bands:
    label_en: "Cap on eligible costs by heated net floor area"
    label_de: "Förderhöchstbetrag nach beheizter Nettogrundfläche"
    unit: "EUR"
    value:
      flat_eur: 28000
      flat_up_to_m2: 150
      bands:
        - {up_to_m2: 400, eur_per_m2: 197}
        - {up_to_m2: 1000, eur_per_m2: 118}
        - {up_to_m2: null, eur_per_m2: 79}
    status: sourced
    source: "KfW 522 page. The cap starts to fall on 1 February 2027. Whether the pool hall counts fully needs checking with an energy consultant."
  reported_heat_pool_share:
    label_en: "Share of reported useful heat that goes to basins and hall (rest: showers, other)"
    label_de: "Anteil der gemeldeten Nutzwärme für Becken und Halle (Rest: Duschen, Sonstiges)"
    unit: "1"
    pessimistic: 0.70
    central: 0.80
    optimistic: 0.90
    status: illustrative
    source: "Assumption for the optional demand calibration only. Replace with measured data where available."
  shower_water_l_per_visitor:
    label_en: "Shower water per visitor (hot water demand of the model)"
    label_de: "Duschwasser je Besucher (Warmwasserbedarf im Modell)"
    unit: "L"
    value: 50.0
    status: sourced
    source: "VDI 2089 Part 1: 0.05 to 0.08 m3 shower water per person, the lower end is used (2010 edition, read from an excerpt; the 2023 edition is not checked). An answer of the operator replaces it."
  shower_mix_temp_c:
    label_en: "Shower water temperature"
    label_de: "Duschwassertemperatur"
    unit: "degC"
    value: 40.0
    status: illustrative
    source: "Assumption. Mains water temperature by month comes from data/splash/config/network_water_temp_monthly.csv (illustrative, 6.5 to 17 degC)."
  stay_in_water_h:
    label_en: "Mean stay of a visitor in the water (converts persons in the water to visitors per hour)"
    label_de: "Mittlere Aufenthaltsdauer im Wasser (rechnet Personen im Wasser in Besucher je Stunde um)"
    unit: "h"
    value: 1.0
    status: illustrative
    source: "Assumption (Little's law: visitors per hour = persons in the water / stay). With annual visitors entered, the value only shapes the daily profile, the annual sum is fixed."
  subsidy_eligible_share:
    label_en: "Share of the heat pump investment that is eligible"
    label_de: "Förderfähiger Anteil der Investition"
    unit: "1"
    value: 1.0
    status: illustrative
    source: "Illustrative value, no source yet."
  subsidy_area_factor:
    label_en: "Heated net floor area as a share of the hall area"
    label_de: "Beheizte Nettogrundfläche als Anteil der Hallenfläche"
    unit: "1"
    value: 1.0
    status: illustrative
    source: "Illustrative value, no source yet."

  # -------------------------------------------------------- emission factors
  ef_gas:
    label_en: "CO2 emission factor, natural gas (billing basis)"
    label_de: "CO2-Emissionsfaktor Erdgas (Abrechnungsbasis)"
    unit: "kg/kWh"
    value: 0.182
    status: illustrative
    source: "Check against the current UBA emission factor list. Value in line with the UBA-based table of the Berlin Senate."
  ef_oil:
