    status: illustrative
    source: "Check against the current UBA emission factor list."
  ef_district_heat:
    label_en: "CO2 emission factor, district heat"
    label_de: "CO2-Emissionsfaktor Fernwärme"
    unit: "kg/kWh"
    value: 0.25
    status: illustrative
    source: "Illustrative value. The factor is specific to each district heating network."
  ef_other_heat:
    label_en: "CO2 emission factor, other heat source"
    label_de: "CO2-Emissionsfaktor sonstige Wärmequelle"
    unit: "kg/kWh"
    value: 0.20
    status: illustrative
    source: "Illustrative value, no source yet."
  ef_electricity:
    label_en: "CO2 emission factor, German grid mix"
    label_de: "CO2-Emissionsfaktor Strommix Deutschland"
    unit: "kg/kWh"
    pessimistic: 0.363
    central: 0.353
    optimistic: 0.300
    status: sourced
    source: "UBA publishes 353 and 363 g/kWh for 2024 in two versions. The optimistic value is a placeholder. Store the version when updating."
  ef_electricity_decline_per_year:
    label_en: "Yearly decline of the grid mix factor"
    label_de: "Jährlicher Rückgang des Strommix-Faktors"
    unit: "1/a"
    pessimistic: 0.0
    central: 0.04
    optimistic: 0.08
    status: illustrative
    source: "Illustrative value, no source yet."
  ef_curtailed:
    label_en: "CO2 factor counted for curtailed renewable electricity"
    label_de: "Angesetzter CO2-Faktor für abgeregelten Erneuerbaren-Strom"
    unit: "kg/kWh"
    value: 0.0
    status: project
    source: "Accounting rule: electricity that would otherwise be lost counts as zero. The app also shows the grid-mix view."

  # --------------------------------------------------------- flexible heating
  heater_efficiency:
    label_en: "Electric heater efficiency"
    label_de: "Wirkungsgrad Heizstab"
    unit: "1"
    value: 0.99
    status: illustrative
    source: "Illustrative value, no source yet."
  flex_threshold_kw:
    label_en: "Aggregated flexibility threshold from the SPLASH policy review"
    label_de: "Schwelle für aggregierte Flexibilität aus dem SPLASH-Policy-Review"
    unit: "kW"
    value: 100
    status: project
    source: "SPLASH policy review (100 kW aggregated threshold)."
  curtailed_price_eur_per_mwh:
