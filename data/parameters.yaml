    value: 70
    status: illustrative
    source: "Illustrative value, no source yet."
  default_air_setpoint_c:
    label_en: "Hall air setpoint (used when not given)"
    label_de: "Hallenlufttemperatur (wenn nicht angegeben)"
    unit: "degC"
    value: 29.0
    status: illustrative
    source: "Illustrative value, no source yet."
  basin_defaults:
    label_en: "Default water temperature by basin type (used when not given)"
    label_de: "Standard-Wassertemperatur je Beckentyp (wenn nicht angegeben)"
    unit: "degC"
    value:
      lap: 27.0
      teaching: 29.0
      therapy: 32.0
      children: 31.0
      leisure: 30.0
      diving: 28.0
      outdoor: 24.0
    status: illustrative
    source: "Illustrative value. SPLASH holds the temperature band by pool type."

  # ----------------------------------------------- heat demand split and shape
  # ------------------------------------------------------------- heat pump
  sink_temps_c:
    label_en: "Heat pump supply temperature by use"
    label_de: "Vorlauftemperatur der Wärmepumpe je Nutzung"
    unit: "degC"
    value:
      pool_water: 38.0
      hall_air: 45.0
      space_heating: 45.0
      dhw: 60.0
    status: illustrative
    source: "Illustrative value, no source yet."
  hp_levels_default:
    label_en: "Uses served by the heat pump (the boiler keeps the rest)"
    label_de: "Von der Wärmepumpe versorgte Nutzungen (den Rest deckt der Kessel)"
    unit: "-"
    value: [pool_water, hall_air, space_heating]
    status: illustrative
    source: "Illustrative value, no source yet."
  source_temps_c:
    label_en: "Heat source temperature for non-air sources"
    label_de: "Wärmequellentemperatur für Nicht-Luft-Quellen"
    unit: "degC"
    value:
      ground: 10.0
      waste: 15.0
    status: illustrative
    source: "Illustrative value, no source yet."
  eta_carnot:
    label_en: "Carnot fraction (share of the ideal COP reached)"
    label_de: "Gütegrad (Anteil des idealen COP)"
    unit: "1"
    pessimistic: 0.40
    central: 0.45
    optimistic: 0.50
    status: illustrative
    source: "Illustrative value. Calibrate against manufacturer data for the heat pump class."
  cop_min:
    label_en: "Lower limit of the COP"
    label_de: "Untergrenze des COP"
    unit: "1"
    value: 1.5
    status: illustrative
    source: "Illustrative value, no source yet."
  cop_max:
    label_en: "Upper limit of the COP"
