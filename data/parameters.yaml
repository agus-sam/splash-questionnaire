    value: 3.0
    status: illustrative
    source: "Illustrative value, no source yet."
  default_operating_weeks:
    label_en: "Operating weeks per year (used when not given)"
    label_de: "Betriebswochen je Jahr (wenn nicht angegeben)"
    unit: "weeks"
    value: 50
    status: illustrative
    source: "Illustrative value, no source yet."
  default_hours_per_week:
    label_en: "Opening hours per week (used when not given)"
    label_de: "Öffnungsstunden je Woche (wenn nicht angegeben)"
