[project]
name = "splash-questionnaire-simulation"
version = "1.5.1"
description = "SPLASH Questionnaire and Simulation: interactive questionnaire with instant heat pump and flexible heating results for swimming pool operators"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
extend-exclude = ["vendor"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
